[tool.poetry]
name = "oasis-graph"
version = "0.1.0"
description = "OasisAI Graph - AST code graph analysis"
authors = ["OasisAI Team <team@oasisai.local>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.29.0"}
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
onnxruntime = ">=1.16.0,<1.22.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
